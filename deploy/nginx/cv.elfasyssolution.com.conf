# Nginx reverse proxy configuration for AI CV Builder
# Domain: cv.elfasyssolution.com
# Target path on VPS: /etc/nginx/sites-available/cv.elfasyssolution.com.conf

# Upstream points to the AI CV Builder Docker container
# (Configured in deploy/production.env HTTP_PORT=7892)
upstream cv_builder {
    server 127.0.0.1:7892;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cv.elfasyssolution.com;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Reverse Proxy to AI CV Builder
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cv.elfasyssolution.com;

    # SSL Certificates (managed via certbot)
    ssl_certificate /etc/letsencrypt/live/cv.elfasyssolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.elfasyssolution.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS and Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow resume and diagnostic document uploads (PDF/DOCX/TXT)
    client_max_body_size 25M;

    # Root proxy pass
    location / {
        proxy_pass http://cv_builder;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Server-Sent Events (SSE) support for AI streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering so AI token streaming is delivered in real-time
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for AI generation and PDF parsing
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Access and Error logs
    access_log /var/log/nginx/cv.elfasyssolution.com.access.log;
    error_log /var/log/nginx/cv.elfasyssolution.com.error.log warn;
}
